name: movie
# Shared conda environment for all analyses: CF modeling, RSA, and encoding.
# All three pillars run in this single environment.
#
# The environment was originally built with CUDA-enabled torch (RTX 5070Ti).
# Recreating it from scratch:
#
#   conda env create -f cf_modeling/environment.yml
#   conda activate movie
#   pip install torch==2.11.0+cu128 --index-url https://download.pytorch.org/whl/cu128
#   pip install himalaya==0.4.11 pycortex mne>=1.9
#
# vicsompy is NOT pip-installed — import directly from source:
#   VICSOMPY_REPO=/home/amin/Research/Representation/Movie/Vicarious_somatotopy
#   sys.path.insert(0, VICSOMPY_REPO)  (done in every CF modeling script)
#
# Verified package versions (movie env, 2026-05):
#   torch          2.11.0+cu128  (CUDA 12.8 — RTX 5070Ti compatible)
#   himalaya       0.4.11
#   pycortex       1.3.0
#   mne            1.9.0
#   scikit-learn   1.3.2
#   scipy          1.15.2        (provides false_discovery_control for FDR)
#   nibabel        5.4.0
#   numpy          1.26.2        (<2.0 required by himalaya 0.4.11)
#   pandas         2.3.3
#   matplotlib     3.8.2
#   h5py           3.16.0
#   joblib         1.5.3
#   tqdm           4.67.3
#   parallel       20260422      (GNU parallel — conda-forge)
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.26,<2.0    # himalaya 0.4.11 requires numpy < 2.0
  - scipy>=1.11         # false_discovery_control added in 1.11 (replaces statsmodels)
  - pandas>=2.0
  - nibabel>=5.1
  - matplotlib>=3.8
  - scikit-learn=1.3.2
  - h5py>=3.9
  - pyyaml>=6.0
  - tqdm>=4.66
  - joblib>=1.3
  - parallel            # GNU parallel for batch subject processing
  - pip
  - pip:
    - torch>=2.6.0      # install manually with CUDA: torch==2.11.0+cu128
    - himalaya==0.4.11
    - pycortex          # flatmap visualisation (CF modeling + viz notebooks)
    - mne>=1.9          # Savitzky-Golay filter (preprocess_individual.py)
    # vicsompy: do NOT pip install — torch version conflict with torch 2.6+
    # Use: sys.path.insert(0, VICSOMPY_REPO) — all scripts do this automatically
