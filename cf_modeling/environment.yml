name: movie
# Shared conda environment for CF modeling, encoding, and RSA analyses.
# Clone from vicsompy_av (already configured with torch 2.11.0+cu128 + CUDA):
#   conda create --clone vicsompy_av --name movie -y
# This file is for reference and reproducibility — the actual env is managed
# via conda directly, NOT via conda env create (to preserve the CUDA torch build).
#
# Key packages verified in movie env:
#   torch 2.11.0+cu128  (CUDA 12.8 — RTX 5070Ti compatible)
#   himalaya 0.3.5
#   scikit-learn 1.3.2
#   pycortex (pycortex.database.db singleton works)
#   GNU parallel (system package)
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.26,<2.0    # himalaya 0.3.5 requires numpy < 2.0
  - scipy>=1.11
  - pandas>=2.0
  - nibabel>=5.1
  - matplotlib>=3.8
  - scikit-learn=1.3.2
  - h5py>=3.9
  - pyyaml>=6.0
  - tqdm>=4.66
  - joblib>=1.3
  - statsmodels>=0.14
  - parallel              # GNU parallel for batch subject processing
  - pip
  - pip:
    - torch>=2.6.0        # movie env has torch 2.11.0+cu128
    - himalaya==0.3.5
    - pycortex            # for flatmap visualisation
    - mne>=1.9            # for Savitzky-Golay filter (preprocess_individual.py)
    # vicsompy: do NOT pip install — import directly from source repo
    # (torch version conflict with RTX 5070Ti / torch 2.6+)
    # All scripts use: sys.path.insert(0, VICSOMPY_REPO)
    # VICSOMPY_REPO = /home/amin/Research/Representation/Movie/Vicarious_somatotopy
