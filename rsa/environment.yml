name: movie
# Shared conda environment for all analyses: CF modeling, RSA, and encoding.
# All three pillars run in this single environment.
#
# See cf_modeling/environment.yml for full setup instructions.
#
# Verified package versions (movie env, 2026-05):
#   torch          2.11.0+cu128  (CUDA 12.8 — RTX 5070Ti compatible)
#   himalaya       0.3.5
#   scikit-learn   1.3.2
#   scipy          1.15.2        (provides false_discovery_control for FDR)
#   nibabel        5.4.0
#   numpy          1.26.2
#   pandas         2.3.3
#   joblib         1.5.3
#   tqdm           4.67.3
#   parallel       20260422      (GNU parallel — conda-forge)
channels:
  - conda-forge
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.26,<2.0
  - scipy>=1.11
  - pandas>=2.0
  - nibabel>=5.1
  - matplotlib>=3.8
  - scikit-learn=1.3.2
  - h5py>=3.9
  - pyyaml>=6.0
  - tqdm>=4.66
  - joblib>=1.3
  - parallel
  - pip
  - pip:
    - torch>=2.6.0
    - himalaya==0.3.5
    - pycortex
    - mne>=1.9
