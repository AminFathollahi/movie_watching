name: analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=1.26
  - scipy>=1.11
  - pandas>=2.0
  - nibabel>=5.1
  - matplotlib>=3.8
  - joblib>=1.3
  - tqdm>=4.66
  - statsmodels>=0.14
  - parallel          # GNU parallel for batch subject processing
  - pip
  - pip:
    - scikit-learn>=1.3
    - himalaya>=0.4.0  # 0.3.5 incompatible with numpy>=2.0 (numpy.core removed)
